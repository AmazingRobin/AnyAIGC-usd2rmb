name: Release

# 推送 v* 标签时自动构建并创建 Release，把两个浏览器的 zip 作为附件上传，
# 用户就可以从 Releases 页面直接下载。
#
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'
  # 也允许手动触发，方便在不打标签的情况下验证构建。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前自检
        run: node scripts/check.mjs

      - name: 校验标签版本与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./src/manifest.chrome.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "标签版本 ($TAG_VERSION) 与 manifest 版本 ($MANIFEST_VERSION) 不一致"
            exit 1
          fi
          echo "版本一致：$TAG_VERSION"

      - name: 打包
        run: node scripts/build.mjs

      - name: 生成校验文件
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 适用浏览器 |
            | --- | --- |
            | `anyaigc-usd2rmb-chrome-*.zip` | Chrome、Edge、Opera、Brave、360、QQ 浏览器 |
            | `anyaigc-usd2rmb-firefox-*.zip` | Firefox |

            安装步骤见 [README](https://github.com/${{ github.repository }}#安装)。

            `SHA256SUMS.txt` 可用于校验文件完整性。

name: Check

# 每次推送和 PR 都跑一遍自检和构建，确保仓库始终处于可发布状态。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自检
        run: node scripts/check.mjs

      - name: 验证构建可用
        run: node scripts/build.mjs

      - name: 验证 zip 可正常解包
        run: |
          cd dist
          for zip in *.zip; do
            echo "检查 $zip"
            unzip -t "$zip"
            unzip -l "$zip" | grep -q 'manifest.json' || { echo "$zip 缺少 manifest.json"; exit 1; }
          done
